  b.querySelectorAll("[data-msgedit]").forEach(function(btn){
    btn.onclick=function(){editingKonvMsgIdx=Number(btn.dataset.msgedit);renderKonvChat(b);};
  });
  b.querySelectorAll("[data-msgdel]").forEach(function(btn){
    btn.onclick=function(){
      var idx=Number(btn.dataset.msgdel);
      confirmDelete("Vill du ta bort meddelandet?",function(){
        k.messages.splice(idx,1);
        saveAndSync("samtaltext");
        renderKonvChat(b);
      });
    };
  });
  if(editingKonvMsgIdx!==null){
    var msgEditInp=b.querySelector("#konv-msg-edit-inp");
    autoGrowTextarea(msgEditInp);
    var msgEditSave=b.querySelector("#konv-msg-edit-save");
    var msgEditCancel=b.querySelector("#konv-msg-edit-cancel");
    if(msgEditSave)msgEditSave.onclick=function(){
      var txt=msgEditInp.value.trim();
      if(txt)k.messages[editingKonvMsgIdx].text=txt;
      editingKonvMsgIdx=null;
      saveAndSync("samtaltext");
      renderKonvChat(b);
    };
    if(msgEditCancel)msgEditCancel.onclick=function(){editingKonvMsgIdx=null;renderKonvChat(b);};
  }

  if(konvSender==="dem"){
    var noteInp=b.querySelector("#konv-note-inp");
    if(noteInp)noteInp.oninput=function(){konvNoteDraft=noteInp.value;};
    autoGrowTextarea(noteInp);
    bindNotesBox(b,k,"konv",konvNoteDropdown,function(){
      konvNoteDraft="";
      renderKonvChat(b);
    },"samtaltext");
  }

  if(konvSender==="mig"){
    bindChips(b,"konvaictx",function(){return konvAiCtx;},function(v){konvAiCtx=v;});
    var aiInp=b.querySelector("#konv-ai-inp");
    if(aiInp)aiInp.oninput=function(){konvAiDraft=aiInp.value;};
    autoGrowTextarea(aiInp);
    var utvBtn=b.querySelector("#konv-utv-btn");
    if(utvBtn)utvBtn.onclick=function(){
      var txt=b.querySelector("#konv-ai-inp").value.trim();
      if(!txt)return;
      konvAiDraft=txt;
      doKonvUtvardering(k,txt);
    };
    var klarBtn=b.querySelector("#konv-klar-btn");
    if(klarBtn)klarBtn.onclick=function(){
      var txt=b.querySelector("#konv-ai-inp").value.trim();
      if(!txt)return;
      konvAiDraft=txt;
      doKonvKlarhet(k,txt);
    };
    var forslagBtn=b.querySelector("#konv-forslag-btn");
    if(forslagBtn)forslagBtn.onclick=function(){
      var txt=b.querySelector("#konv-ai-inp").value.trim();
      konvAiDraft=txt;
      doKonvForslag(k,txt);
    };
    var resultMsgEl=b.querySelector("#konv-ai-result-msg");
    if(resultMsgEl)resultMsgEl.onclick=function(){
      if(konvAiResult&&konvAiResult.message){
        konvMsgDraft=konvAiResult.message;
        renderKonvChat(b);
      }
    };
    if(konvAiResult&&konvAiResult.chat){
      bindChatContinuation(b,"konvai","Du ar en kommunikationscoach. Fortsätt hjälpa personen bygga vidare på det ni just pratat om, svara med vanlig text.",function(){return konvAiResult.chat;},function(){renderKonvChat(b);});
    }
  }
}

async function doKonvUtvardering(k,text){
  konvAiLoading=true;renderKonvChat(document.getElementById("samtal-content"));
  var threadText=k.messages.slice(-12).map(function(m){return (m.sender==="mig"?"Jag":"De")+": "+m.text;}).join("\n");
  var notesTxt=notesContextText(k);
  var notePart=notesTxt?("\n\nYtterligare information om samtalet: "+notesTxt):"";
  var sys="Du ar en kommunikationscoach. Har ar samtalshistoriken hittills:\n\n"+(threadText||"(inga tidigare meddelanden)")+notePart+"\n\nPersonen funderar pa att skicka foljande meddelande till "+konvAiCtx.toLowerCase()+". Ge en konstruktiv utvardering av meddelandet - vad fungerar bra, vad kan bli battre, och nagra konkreta tips. Svara BARA med giltig JSON: {\"evaluation\":\"...\",\"tips\":[\"...\",\"...\",\"...\"]}";
  try{
    var res=await aiCall(sys,"Meddelandet jag funderar pa att skicka: "+text,1000);
    var data=await res.json();
    var parsed=JSON.parse(aiText(data).replace(/```json|```/g,"").trim());
    var evalText=(parsed.evaluation||"")+((parsed.tips||[]).length?"\n\nTips:\n"+parsed.tips.join("\n"):"");
    konvAiResult={type:"evaluation",evaluation:parsed.evaluation||"",tips:parsed.tips||[],chat:[{role:"user",content:"Meddelandet jag funderar pa att skicka: "+text},{role:"assistant",content:evalText}]};
  }catch(e){
    konvAiResult={type:"evaluation",evaluation:"Kunde inte utvardera. Forsok igen.",tips:[],chat:[{role:"user",content:text},{role:"assistant",content:"Kunde inte utvardera. Forsok igen."}]};
  }
  konvAiLoading=false;renderKonvChat(document.getElementById("samtal-content"));
}

async function doKonvKlarhet(k,text){
  konvAiLoading=true;renderKonvChat(document.getElementById("samtal-content"));

async function doKonvForslag(k,goal){

// ---- MUNTLIGT (som Text, men med en egenskriven sammanfattning istallet for chattbubblor) ----
var muntKonversationer=[]; // [{id,name,entries:[{id,summary,feeling,timestamp}],notes:[{id,text,timestamp}],timestamp}]
var activeMuntKonvId=null;
var muntNewName="";
var muntAiCtx="Kompis", muntAiDraft="", muntAiResult=null, muntAiLoading=false;
var muntSummaryDraft="", muntFeelingDraft="", editingMuntEntryId=null, muntNameEditing=false, muntKonvListRenamingId=null;
var muntNoteDraft="", muntNoteDropdown={open:false};

function renderMuntligt(){
  var b=document.getElementById("samtal-content");
  if(activeMuntKonvId)renderMuntKonvOpen(b);
  else renderMuntKonvList(b);
}

function migrateMuntEntries(k){
  if(!k.entries){
    k.entries=(k.summary||k.feeling)?[{id:"e0",summary:k.summary||"",feeling:k.feeling||"",timestamp:k.timestamp||new Date().toISOString()}]:[];
    delete k.summary;delete k.feeling;
  }
}

function renderMuntKonvList(b){
  var sorted=muntKonversationer.slice().sort(function(a,b2){return new Date(b2.timestamp)-new Date(a.timestamp);});
  var list=sorted.length?sorted.map(function(k){
    migrateMuntEntries(k);
    var last=k.entries.length?k.entries[k.entries.length-1]:null;
    var nameHtml=muntKonvListRenamingId===k.id
      ?"<div style='display:flex;gap:6px'><input class='inp' id='muntkonv-list-rename-inp' value='"+esc(k.name)+"' style='flex:1'/><button class='sec ghost' data-renamemuntsave='"+k.id+"' style='padding:6px 10px'>Spara</button></div>"
      :"<div class='kmsg' style='font-weight:600;display:flex;align-items:center;gap:6px'>"+esc(k.name)+"<button class='delbtn' data-renamemuntkonv='"+k.id+"' style='font-size:12px;padding:2px 5px;color:#5c5c5c'>✏️</button></div>";
    return "<div class=\'khist\' data-muntkonv=\'"+k.id+"\' style=\'display:flex;align-items:center;gap:8px\'>"
      +"<div style=\'flex:1;min-width:0\'>"
      +nameHtml
      +"<div class=\'kmeta\'>"+(last&&last.summary?esc(last.summary.slice(0,40))+(last.summary.length>40?"…":""):"Ingen sammanfattning än")+"</div>"
      +"</div>"
      +(last&&last.feeling?"<span class=\'kbadge\'>"+esc(last.feeling.slice(0,12))+"</span>":"")
      +"<span class=\'kbadge\'>"+k.entries.length+"</span>"
      +"<button class=\'delbtn\' data-delmuntkonv=\'"+k.id+"\' style=\'font-size:16px\'>x</button>"
      +"</div>";
  }).join(""):"<div class=\'empty\' style=\'padding:30px 0\'><div class=\'eico\'>🗣️</div>Inga konversationer ännu.</div>";

  b.innerHTML="<div class=\'lbl\'>Ny konversation</div>"
    +"<div class=\'row\'><input class=\'inp\' id=\'muntkonv-name-inp\' placeholder=\'Namn på konversationen...\' value=\'"+esc(muntNewName)+"\'/>"
    +"<button class=\'abtn\' id=\'muntkonv-create-btn\'>+</button></div>"
    +"<div class=\'mt20\'><div class=\'lbl\'>Konversationer</div>"+list+"</div>";

  var nameInp=b.querySelector("#muntkonv-name-inp");
  if(nameInp)nameInp.oninput=function(){muntNewName=nameInp.value;};
  var createBtn=b.querySelector("#muntkonv-create-btn");
  var createFn=function(){
    var name=b.querySelector("#muntkonv-name-inp").value.trim();
    if(!name)return;
    var k={id:String(Date.now()),name:name,entries:[],notes:[],timestamp:new Date().toISOString()};
    muntKonversationer.unshift(k);
    muntNewName="";
    activeMuntKonvId=k.id;
    saveAndSync("samtalmuntligt");
    renderMuntligt();
  };
  if(createBtn)createBtn.onclick=createFn;
  if(nameInp)nameInp.onkeydown=function(e){if(e.key==="Enter")createFn();};

  b.querySelectorAll("[data-muntkonv]").forEach(function(el){
    el.onclick=function(e){
      if(e.target.dataset.delmuntkonv||e.target.dataset.renamemuntkonv)return;
      activeMuntKonvId=el.dataset.muntkonv;muntAiResult=null;muntAiDraft="";muntSummaryDraft="";muntFeelingDraft="";muntNameEditing=false;
      renderMuntligt();
    };
  });
  b.querySelectorAll("[data-renamemuntkonv]").forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      muntKonvListRenamingId=btn.dataset.renamemuntkonv;
      renderMuntKonvList(b);
    };
  });
  var renameMuntSaveFn=function(){
    var kid=muntKonvListRenamingId;
    var inp=b.querySelector("#muntkonv-list-rename-inp");
    var v=(inp?inp.value:"").trim();
    var k=muntKonversationer.find(function(x){return x.id===kid;});
    if(k&&v)k.name=v;
    muntKonvListRenamingId=null;
    saveAndSync("samtalmuntligt");
    renderMuntKonvList(b);
  };
  b.querySelectorAll("[data-renamemuntsave]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();renameMuntSaveFn();};
  });
  var renameMuntInp=b.querySelector("#muntkonv-list-rename-inp");
  if(renameMuntInp){
    renameMuntInp.onclick=function(e){e.stopPropagation();};
    renameMuntInp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();renameMuntSaveFn();}};
    setTimeout(function(){renameMuntInp.focus();renameMuntInp.select();},50);
  }
  b.querySelectorAll("[data-delmuntkonv]").forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var kid=btn.dataset.delmuntkonv;
      var k=muntKonversationer.find(function(x){return x.id===kid;});
      confirmDelete("Vill du ta bort konversationen \'"+esc(k?k.name:"")+"\'?",function(){
        muntKonversationer=muntKonversationer.filter(function(x){return x.id!==kid;});
        saveAndSync("samtalmuntligt");renderMuntligt();
      });
    };
  });
}

function muntContextParts(k){
  migrateMuntEntries(k);
  var parts=k.entries.map(function(e){
    var p="Sammanfattning: "+e.summary;
    if(e.feeling)p+=" (Känsla: "+e.feeling+")";
    return p;
  });
  var notesTxt=notesContextText(k);
  if(notesTxt)parts.push("Ytterligare information: "+notesTxt);
  return parts.length?parts.join("\n\n"):"(ingen sammanfattning skriven an)";
}

  var k=muntKonversationer.find(function(x){return x.id===activeMuntKonvId;});
  if(!k){activeMuntKonvId=null;renderMuntligt();return;}

  var resultHtml="";
  if(muntAiLoading){
    resultHtml=spin();
  } else if(muntAiResult){
    if(muntAiResult.type==="tips"||muntAiResult.type==="tankepa"){
      var items=muntAiResult.type==="tips"?muntAiResult.tips:muntAiResult.points;
      resultHtml="<div class=\'mt12\'>"
        +(items&&items.length?items.map(function(t){return "<div class=\'enote\' style=\'margin-bottom:6px\'>• "+esc(t)+"</div>";}).join(""):"")
        +chatContinuationHtml(muntAiResult.chat,"muntai")
        +"</div>";

        +(muntAiResult.advice?"<div class=\'tbox\'>"+esc(muntAiResult.advice)+"</div>":"")
        +(muntAiResult.steps&&muntAiResult.steps.length?("<div class=\'lbl\'>Steg</div>"+muntAiResult.steps.map(function(s,i){return "<div class=\'enote\' style=\'margin-bottom:6px\'>"+(i+1)+". "+esc(s)+"</div>";}).join("")):"")
        +chatContinuationHtml(muntAiResult.chat,"muntai")
        +"</div>";
    }

      return "<div class=\'khist\'>"

        +"<div class=\'lbl\' style=\'margin-bottom:4px\'>Känsla</div>"
        +"<textarea class=\'ta\' data-entryeditfeeling=\'"+e.id+"\' style=\'min-height:50px;margin-bottom:6px\'>"+esc(e.feeling)+"</textarea>"
        +"<div style=\'display:flex;gap:8px\'>"
        +"<button class=\'sec\' data-entrysave=\'"+e.id+"\' style=\'flex:1\'>Spara</button>"
        +"<button class=\'sec ghost\' data-entrycancel=\'"+e.id+"\' style=\'flex:1\'>Avbryt</button>"
        +"</div></div>";
    }

    var showBadge=!!(e.summary&&e.feeling);

      +"<div class=\'kmsg\' style=\'white-space:normal\'>"+esc(mainText||"(Tom post)")+"</div>"
      +(showBadge?"<div class=\'kmeta\' style=\'margin-top:2px\'><span class=\'kbadge\'>"+esc(e.feeling)+"</span></div>":"")
      +"<div class=\'kmeta\' style=\'margin-top:2px\'>"+fd(e.timestamp)+"</div>"
      +"</div>"
      +"<button class=\'delbtn\' data-entryeditbtn=\'"+e.id+"\' style=\'font-size:15px\'>✏️</button>"
      +"<button class=\'delbtn\' data-entrydel=\'"+e.id+"\' style=\'font-size:18px\'>x</button>"
      +"</div>";
  }).join(""):"<div class=\'empty\' style=\'padding:16px 0;font-size:12px\'>Inga poster än.</div>";

  var muntNameHtml=muntNameEditing
    ?"<div style='display:flex;gap:6px;margin-bottom:8px'><input class='inp' id='muntkonv-name-inp' value='"+esc(k.name)+"' style='flex:1'/><button class='sec ghost' id='muntkonv-name-save-btn' style='padding:8px 12px'>Spara</button></div>"
    :"<div class='lbl' style='display:flex;align-items:center;gap:8px'>"+esc(k.name)+"<button class='delbtn' id='muntkonv-name-edit-btn' style='font-size:13px;padding:2px 6px;color:#5c5c5c'>✏️</button></div>";
  b.innerHTML="<button class=\'sec ghost\' id=\'muntkonv-back-btn\' style=\'margin-bottom:12px\'>&#8592; Alla konversationer</button>"
    +muntNameHtml
    +entriesHtml
    +"<div class=\'mt12\' style=\'display:flex;gap:10px;margin-bottom:10px\'>"
    +"<div style=\'flex:3\'><div class=\'lbl\'>Sammanfattning</div><textarea class=\'ta\' id=\'muntkonv-summary-inp\' placeholder=\'Skriv din egen sammanfattning av konversationen...\' style=\'min-height:90px\'>"+esc(muntSummaryDraft)+"</textarea></div>"
    +"<div style=\'flex:1\'><div class=\'lbl\'>Känsla</div><textarea class=\'ta\' id=\'muntkonv-feeling-inp\' placeholder=\'Hur kändes samtalet?\' style=\'min-height:90px\'>"+esc(muntFeelingDraft)+"</textarea></div>"
    +"</div>"
    +"<button class=\'sec ghost\' id=\'muntkonv-add-entry-btn\' style=\'width:100%;margin-bottom:6px\'>Lägg till</button>"
    +"<div class=\'mt12\'>"+notesBoxHtml(k,"muntkonv",muntNoteDraft,muntNoteDropdown.open)+"</div>"

  if(m)return m[1];

function getRecentMediaItems(limit){
  var all=[];

    var tb=(b.item&&b.item.timestamp)?new Date(b.item.timestamp).getTime():0;
    return tb-ta;
  });
  return all.slice(0,limit);
}

function renderObjRecension(){
  if(objRecensionTillverkare!==null)return renderObjRecensionByTillverkare();

  var c=document.getElementById("utv-content");
  if(!objRecensionCat||OBJ_CAT_PRESETS.indexOf(objRecensionCat)<0)objRecensionCat=OBJ_CAT_PRESETS[0]||"";
  var catOptions=OBJ_CAT_PRESETS.map(function(catName){return "<option value='"+esc(catName)+"'"+(catName===objRecensionCat?" selected":"")+">"+esc(catName)+"</option>";}).join("");

  var entries=objFardig.filter(function(e){return e.cat===objRecensionCat;});
  var counts={};
  entries.forEach(function(e){
    var key=e.tillverkare?e.tillverkare:OBJ_UNKNOWN_TILLVERKARE;
    counts[key]=(counts[key]||0)+1;
  });
  var tillverkares=Object.keys(counts).filter(function(k){return k!==OBJ_UNKNOWN_TILLVERKARE;}).sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase(),"sv");});
  if(counts[OBJ_UNKNOWN_TILLVERKARE])tillverkares.push(OBJ_UNKNOWN_TILLVERKARE);

  var list=tillverkares.length?tillverkares.map(function(tv){
    var label=tv===OBJ_UNKNOWN_TILLVERKARE?"Okänd tillverkare":tv;
    return "<div class='khist' style='display:flex;align-items:center;gap:8px' data-rectillverkare='"+esc(tv)+"'>"
      +"<div style='flex:1;min-width:0'><div class='kmsg' style='white-space:normal;font-weight:600'>"+esc(label)+"</div>"
      +"<div class='kmeta'><span class='kbadge'>"+counts[tv]+" recensioner</span></div></div>"
      +"</div>";
  }).join(""):"<div class='empty' style='padding:30px 0'><div class='eico'>📝</div>Inga recensioner i denna kategori annu.</div>";

    +"<div class='lbl'>Recensioner</div>"
    +"<select id='objrec-cat-select' style='width:100%;background:#161616;border:1px solid #2a2a2a;border-radius:10px;color:#f2f2f2;font-size:14px;padding:10px 12px;cursor:pointer;font-family:inherit;margin-bottom:14px'>"+catOptions+"</select>"
    +"<div class='lbl'>Tillverkare</div>"+list;

  c.querySelector("#objrec-back").onclick=function(){renderObj();};

    el.onclick=function(){objRecensionTillverkare=el.dataset.rectillverkare;renderObjRecension();};

function renderSamtalsamnen(){
  var c=document.getElementById("konv-content");
  var todayStart=new Date();todayStart.setHours(0,0,0,0);
  var todayEnd=new Date();todayEnd.setHours(23,59,59,999);
  var todayAmne=amneHist.filter(function(f){var t=new Date(f.timestamp);return t>=todayStart&&t<=todayEnd;});

  var catOptions="<option value=''>Ingen kategori</option>"
    +AMNE_CAT_PRESETS.map(function(cat){return "<option value='"+esc(cat)+"'"+(cat===amneCatSelect?" selected":"")+">"+esc(cat)+"</option>";}).join("");
  var readCatOptions="<option value=''>Välj kategori</option>"
    +AMNE_CAT_PRESETS.map(function(cat){return "<option value='"+esc(cat)+"'"+(cat===amneReadCat?" selected":"")+">"+esc(cat)+"</option>";}).join("");

  var todayList=todayAmne.length?todayAmne.map(function(f){
    return editingAmneKeyLog==="today:"+f.id?amneEditRow(f,"today"):amneRow(f,"today");
  }).join(""):"<div style='font-size:13px;color:#5c5c5c;margin-top:10px;text-align:center'>Inga samtalsämnen idag annu.</div>";

  var readSection="";
  if(amneReadActive&&amneReadCat){
    var catAmne=amneHist.filter(function(f){return f.category===amneReadCat;});
    readSection="<div class='mt20'><div class='lbl'>"+esc(amneReadCat)+" ("+catAmne.length+")</div>"
      +(catAmne.length?catAmne.map(function(f){
        return editingAmneKeyLog==="read:"+f.id?amneEditRow(f,"read"):amneRow(f,"read");
      }).join(""):"<div style='font-size:13px;color:#5c5c5c;margin-top:10px;text-align:center'>Inga samtalsämnen i denna kategori annu.</div>")
      +"</div>";
  }

  var todayAmneIds={};todayAmne.forEach(function(f){todayAmneIds[f.id]=true;});
  var remainingAmne=Math.max(0,5-todayAmne.length);
  var recentAmne=remainingAmne>0
    ?amneHist.filter(function(f){return !todayAmneIds[f.id];}).sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);}).slice(0,remainingAmne)
    :[];
  var recentHtml=recentAmne.length
    ?"<div class='mt20'><div class='lbl'>Senaste 5</div>"
      +recentAmne.map(function(f){
        return editingAmneKeyLog==="recent:"+f.id?amneEditRow(f,"recent"):amneRow(f,"recent");
      }).join("")
      +"</div>"
    :"";

  c.innerHTML="<div style='font-size:13px;color:#5c5c5c;margin-bottom:16px;line-height:1.5'>Spara idéer på samtalsämnen inför nästa samtal med någon.</div>"
    +"<div class='lbl'>Kategori</div>"
    +"<select id='amnecat-select' style='width:100%;background:#161616;border:1px solid #2a2a2a;border-radius:10px;color:#f2f2f2;font-size:14px;padding:10px 12px;cursor:pointer;font-family:inherit;margin-bottom:10px'>"+catOptions+"</select>"
    +"<textarea class='ta' id='amnein' placeholder='Vilket samtalsämne?'>"+esc(amneDraft)+"</textarea>"
    +"<button class='sec' id='amneadd' style='width:100%'>Spara samtalsämne</button>"
    +"<div class='mt20'><div class='lbl'>Läs samtalsämnen per kategori</div>"
    +"<div style='display:flex;gap:8px'>"
    +"<select id='amneread-select' style='flex:1;background:#161616;border:1px solid #2a2a2a;border-radius:10px;color:#f2f2f2;font-size:13px;padding:0 10px;cursor:pointer;font-family:inherit'>"+readCatOptions+"</select>"
    +"<button id='amneread-btn' class='sec ghost' style='padding:0 18px'>Läs</button>"
    +"</div>"
    +readSection
    +recentHtml
    +"</div>"
    +"<div class='mt20'><div class='lbl'>Dagens samtalsämnen</div>"+todayList+"</div>";

  var catSel=c.querySelector("#amnecat-select");
  if(catSel)catSel.onchange=function(){amneCatSelect=catSel.value;};

  var ta=c.querySelector("#amnein");
  if(ta)ta.oninput=function(){amneDraft=ta.value;};
  c.querySelector("#amneadd").onclick=function(){
    var txt=c.querySelector("#amnein").value.trim();
    if(!txt)return;
    var entry={id:Date.now(),text:txt,timestamp:new Date().toISOString()};
    if(amneCatSelect)entry.category=amneCatSelect;
    amneHist.unshift(entry);
    amneDraft="";saveAndSync("samtalsamnen");renderSamtalsamnen();
  };

  var readSel=c.querySelector("#amneread-select");
  if(readSel)readSel.onchange=function(){amneReadCat=readSel.value;};
  c.querySelector("#amneread-btn").onclick=function(){
    if(!c.querySelector("#amneread-select").value){alert("Välj en kategori först.");return;}
    amneReadCat=c.querySelector("#amneread-select").value;
    amneReadActive=true;renderSamtalsamnen();
  };

  c.querySelectorAll("[data-delamnelog]").forEach(function(btn){
    btn.onclick=function(){
      amneHist=amneHist.filter(function(f){return f.id!==Number(btn.dataset.delamnelog);});
      editingAmneKeyLog=null;saveAndSync("samtalsamnen");renderSamtalsamnen();
    };
  });
  c.querySelectorAll("[data-editamnelog]").forEach(function(btn){
    btn.onclick=function(){editingAmneKeyLog=btn.dataset.editamnelog;renderSamtalsamnen();};
  });
  c.querySelectorAll("[data-saveamnelog]").forEach(function(btn){
    btn.onclick=function(){
      var parts=btn.dataset.saveamnelog.split(":");
      var prefix=parts[0],fid=Number(parts[1]);
      var f=amneHist.find(function(x){return x.id===fid;});
      var inp=c.querySelector("#editamnelog-"+prefix+"-"+fid);
      var catSel2=c.querySelector("#editamnecatlog-"+prefix+"-"+fid);
      if(f&&inp&&inp.value.trim())f.text=inp.value.trim();
      if(f&&catSel2)f.category=catSel2.value||undefined;
      editingAmneKeyLog=null;saveAndSync("samtalsamnen");renderSamtalsamnen();
    };
  });
  c.querySelectorAll("[data-cancelamnelog]").forEach(function(btn){
    btn.onclick=function(){editingAmneKeyLog=null;renderSamtalsamnen();};
  });
}

  var c=document.getElementById("fundering-content");
  if(!c)return;
  var subTabs="<div style='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px'>"
    +"<button class='mode-btn"+(lardomSubview==="vokabular"?" on":"")+"' data-lardomsub='vokabular' style='font-size:11px'>Vokabulär</button>"
    +"<button class='mode-btn"+(lardomSubview==="kunskap"?" on":"")+"' data-lardomsub='kunskap' style='font-size:11px'>Kunskap</button>"
    +"</div>";
  c.innerHTML=subTabs+"<div id='lardom-content'></div>";
  c.querySelectorAll("[data-lardomsub]").forEach(function(btn){
    btn.onclick=function(){lardomSubview=btn.dataset.lardomsub;renderLardom();};
  });
  var tab=lardomSubview;
  var lc=document.getElementById("lardom-content");
  if(!tabLoaded[tab]){
    if(lc)lc.innerHTML="<div style='padding:30px;text-align:center;color:#5c5c5c;font-size:13px'>⏳ Laddar...</div>";
    loadTab(tab).then(function(){renderLardomContent();});
  } else {
    renderLardomContent();
  }
}
function renderLardomContent(){
  if(lardomSubview==="vokabular")renderVokabular();
  else renderKunskap();
}

// Delad enkel lista (text + tidsstämpel) som Vokabulär/Kunskap/Tips & Tricks alla använder
// tills vidare - byggs ut olika för var och en senare.
function lardomEntryRow(entry,delAttr,editAttr,editingId){
  if(editAttr&&editingId===entry.id){
    return "<div class='khist'>"
      +"<textarea class='ta' data-"+editAttr+"inp='"+entry.id+"' style='min-height:60px;margin-bottom:6px'>"+esc(entry.text)+"</textarea>"
      +"<div style='display:flex;gap:8px'>"
      +"<button class='sec' data-"+editAttr+"save='"+entry.id+"' style='flex:1'>Spara</button>"
      +"<button class='sec ghost' data-"+editAttr+"cancel='"+entry.id+"' style='flex:1'>Avbryt</button>"
      +"</div></div>";
  }
  return "<div class='khist' style='display:flex;align-items:flex-start;gap:8px'>"
    +"<div style='flex:1;min-width:0'><div class='kmsg' style='white-space:normal'>"+esc(entry.text)+"</div>"
    +"<div class='kmeta'>"+fd(entry.timestamp)+"</div></div>"
    +(editAttr?"<button class='delbtn' data-"+editAttr+"edit='"+entry.id+"' style='font-size:15px'>✏️</button>":"")
    +"<button class='delbtn' data-"+delAttr+"='"+entry.id+"' style='font-size:18px'>x</button>"
    +"</div>";
}

function renderVokabular(){
  var c=document.getElementById("lardom-content");
  if(!c)return;
  var list=vokabularHist.length?vokabularHist.map(function(e){return lardomEntryRow(e,"delvokabular","vokabular",editingVokabularId);}).join(""):"<div class='empty' style='padding:20px 0'><div class='eico'>🔤</div>Inget sparat än. Använd 📌-knappen i AI → Översättning eller Ordråd för att spara hit.</div>";
  c.innerHTML="<div class='lbl'>Sparat</div>"+list;
  c.querySelectorAll("[data-delvokabular]").forEach(function(btn){
    btn.onclick=function(){
      confirmDelete("Vill du ta bort det här?",function(){
        vokabularHist=vokabularHist.filter(function(x){return x.id!==Number(btn.dataset.delvokabular);});
        saveAndSync("vokabular");renderVokabular();
      });
    };
  });
  c.querySelectorAll("[data-vokabularedit]").forEach(function(btn){
    btn.onclick=function(){editingVokabularId=Number(btn.dataset.vokabularedit);renderVokabular();};
  });
  c.querySelectorAll("[data-vokabularcancel]").forEach(function(btn){
    btn.onclick=function(){editingVokabularId=null;renderVokabular();};
  });
  c.querySelectorAll("[data-vokabularsave]").forEach(function(btn){
    btn.onclick=function(){
      var eid=Number(btn.dataset.vokabularsave);
      var entry=vokabularHist.find(function(x){return x.id===eid;});
      var inp=c.querySelector("[data-vokabularinp='"+eid+"']");
      if(entry&&inp&&inp.value.trim())entry.text=inp.value.trim();
      editingVokabularId=null;
      saveAndSync("vokabular");renderVokabular();
    };
  });
}

function renderKunskap(){
  var c=document.getElementById("lardom-content");
  if(!c)return;
  if(activeKunskapId)renderKunskapOpen(c);
  else renderKunskapList(c);
}

function kunskapPreviewText(chat){
  chat=chat||[];
  var q=chat[0]?chatContentToText(chat[0].content):"";
  var a=chat[1]?chatContentToText(chat[1].content):"";
  return q+(a?" — "+a:"");
}
function renderKunskapList(c){
  var sorted=kunskapHist.slice().sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});
  var list=sorted.length?sorted.map(function(e){
    if(editingKunskapId===e.id){
      var q=e.chat&&e.chat[0]?chatContentToText(e.chat[0].content):"";
      var a=e.chat&&e.chat[1]?chatContentToText(e.chat[1].content):"";
      return "<div class='khist'>"
        +"<div class='lbl' style='margin-bottom:4px'>Fråga</div>"
        +"<textarea class='ta' data-kunskapqinp='"+e.id+"' style='min-height:50px;margin-bottom:6px'>"+esc(q)+"</textarea>"
        +"<div class='lbl' style='margin-bottom:4px'>Svar</div>"
        +"<textarea class='ta' data-kunskapainp='"+e.id+"' style='min-height:80px;margin-bottom:6px'>"+esc(a)+"</textarea>"
        +"<div style='display:flex;gap:8px'>"
        +"<button class='sec' data-kunskapsave='"+e.id+"' style='flex:1'>Spara</button>"
        +"<button class='sec ghost' data-kunskapcancel='"+e.id+"' style='flex:1'>Avbryt</button>"
        +"</div></div>";
    }
    var previewFull=kunskapPreviewText(e.chat);
    var preview=previewFull.length>120?previewFull.slice(0,120)+"…":previewFull;
    return "<div class='khist' data-openkunskap='"+e.id+"' style='display:flex;align-items:flex-start;gap:8px;cursor:pointer'>"
      +"<div style='flex:1;min-width:0'><div class='kmsg' style='white-space:normal'>"+esc(preview)+"</div>"
      +"<div class='kmeta'>"+fd(e.timestamp)+(e.chat&&e.chat.length>2?" · "+e.chat.length+" meddelanden":"")+"</div></div>"
      +"<button class='delbtn' data-kunskapedit='"+e.id+"' style='font-size:15px'>✏️</button>"
      +"<button class='delbtn' data-delkunskap='"+e.id+"' style='font-size:18px'>x</button>"
      +"</div>";
  }).join(""):"<div class='empty' style='padding:20px 0'><div class='eico'>📚</div>Inget sparat än. Använd 📌-knappen i AI → Tips/Terapi/Översättning eller sökrutorna längst ner för att spara hit.</div>";

  c.innerHTML="<div class='lbl'>Sparat</div>"+list;

  c.querySelectorAll("[data-openkunskap]").forEach(function(el){
    el.onclick=function(e){
      if(e.target.closest("[data-kunskapedit]")||e.target.closest("[data-delkunskap]"))return;
      activeKunskapId=el.dataset.openkunskap;
      renderKunskap();
    };
  });
  c.querySelectorAll("[data-kunskapedit]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();editingKunskapId=Number(btn.dataset.kunskapedit);renderKunskapList(c);};
  });
  c.querySelectorAll("[data-kunskapcancel]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();editingKunskapId=null;renderKunskapList(c);};
  });
  c.querySelectorAll("[data-kunskapsave]").forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var eid=Number(btn.dataset.kunskapsave);
      var entry=kunskapHist.find(function(x){return x.id===eid;});
      var qInp=c.querySelector("[data-kunskapqinp='"+eid+"']");
      var aInp=c.querySelector("[data-kunskapainp='"+eid+"']");
      if(entry){
        if(!entry.chat)entry.chat=[];
        if(!entry.chat[0])entry.chat[0]={role:"user",content:""};
        if(!entry.chat[1])entry.chat[1]={role:"assistant",content:""};
        if(qInp)entry.chat[0].content=qInp.value.trim();
        if(aInp)entry.chat[1].content=aInp.value.trim();
      }
      editingKunskapId=null;
      saveAndSync("kunskap");renderKunskapList(c);
    };
  });
  c.querySelectorAll("[data-delkunskap]").forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      confirmDelete("Vill du ta bort det här?",function(){
        kunskapHist=kunskapHist.filter(function(x){return x.id!==Number(btn.dataset.delkunskap);});
        saveAndSync("kunskap");renderKunskapList(c);
      });
    };
  });
}

function renderKunskapOpen(c){
  var entry=kunskapHist.find(function(x){return x.id===Number(activeKunskapId)||x.id===activeKunskapId;});
  if(!entry){activeKunskapId=null;renderKunskapList(c);return;}
  var thread=(entry.chat||[]).map(function(m){
    if(m.role==="user"){
      return "<div style='display:flex;justify-content:flex-end;margin-bottom:8px'><div class='bubble-me'>"+esc(m.content)+"</div></div>";
    }
    return "<div style='display:flex;justify-content:flex-start;margin-bottom:8px'><div class='bubble-them'>"+esc(m.content)+"</div></div>";
  }).join("");
  c.innerHTML="<button class='sec ghost' id='kunskap-back-btn' style='margin-bottom:12px'>&#8592; Alla sparade</button>"
    +"<div class='chat-area'>"+thread+"</div>"
    +"<div class='row'><input class='inp' id='kunskapai-followup-inp' placeholder='Ställ en följdfråga...'/><button class='abtn' id='kunskapai-followup-btn'>&#8594;</button></div>"
    +"<div id='kunskapai-followup-loading' style='display:none;text-align:center;color:var(--sub);font-size:12px;margin-top:6px'>Skriver...</div>";
  c.querySelector("#kunskap-back-btn").onclick=function(){activeKunskapId=null;renderKunskap();};
  bindChatContinuation(c,"kunskapai","Du ar en pedagog. Fortsätt hjälpa personen bygga vidare på det ni sparat här, svara med vanlig text.",function(){return entry.chat;},function(){
    saveAndSync("kunskap");
    renderKunskapOpen(c);
  });
}

// ---- HISTORIK ----
var editingId=null;
var openYear=null, openMonth=null, openDay=null, weekViewDay=null;

function getWeekRange(d){
  var dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var dayNum=(dt.getDay()+6)%7; // Mandag=0 ... Sondag=6
  var monday=new Date(dt);monday.setDate(dt.getDate()-dayNum);monday.setHours(0,0,0,0);
  var sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
  return {start:monday,end:sunday};
}

function openToday(){
  var now=new Date();
  openYear=String(now.getFullYear());
  openMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  openDay=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
}

var historySubview="aktiviteter";

function isoWeek(d){
  var dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dayNum=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  var firstThursday=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  var weekNum=1+Math.round(((dt-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return weekNum;
}

function logDurationText(log){
  if(!log.time)return "";
  var parts=log.time.split(" | ");
  var durStr=parts.length>=2?parts[1]:(/^\d{2}:\d{2}$/.test(parts[0])?"":parts[0]);
  if(!durStr)return "";
  var hm=durStr.match(/(\d+)h/);var mm=durStr.match(/(\d+)m/);
  var h=hm?parseInt(hm[1],10):0,m=mm?parseInt(mm[1],10):0;
  if(h===0&&m===0)return "";
  return (h>0?h+"h ":"")+(m>0?m+"m":"");
}
function logEntry(log){
  var c=CATS.find(function(x){return x.id===log.category;});
  var img=imageHist.find(function(i){return i.logId===log.id;});
  if(editingId===log.id){
    var dateVal=log.timestamp?new Date(log.timestamp).toISOString().slice(0,10):"";
    var catOptions=["<option value=''>Välj kategori</option>"].concat(CAT_PRESETS.map(function(p){var ct=CATS.find(function(x){return (x.e+" "+x.label)===p||x.id===p;});var id=ct?ct.id:p;return "<option value='"+esc(id)+"'"+(id===log.category?" selected":"")+">"+esc(p)+"</option>";})).join("");
    // Parse existing time
    var existTidpunkt="",existDurH=0,existDurM=0;
    if(log.time){
      var tparts=log.time.split(" | ");
      if(tparts.length>=1&&tparts[0].match(/^\d{2}:\d{2}$/))existTidpunkt=tparts[0];
      var durStr=tparts.length>=2?tparts[1]:tparts[0];
      var hm=durStr.match(/(\d+)h/);var mm2=durStr.match(/(\d+)m/);
      if(hm)existDurH=parseInt(hm[1]);
      if(mm2)existDurM=parseInt(mm2[1]);
    }
    return "<div class='entry' style='flex-direction:column;gap:10px'>"
      +"<div class='lbl'>Namn</div>"
      +"<input class='inp w100' id='edit-name-"+log.id+"' value='"+esc(log.activity||"")+"'/>"
      +"<div class='lbl'>Kategori</div>"
      +"<select class='inp w100' id='edit-cat-"+log.id+"' style='padding:10px 12px;background:#161616;border:1px solid #2a2a2a;border-radius:10px;color:#f2f2f2;font-size:14px;font-family:inherit'>"+catOptions+"</select>"
      +"<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px'>"
      +"<div>"
      +"<div class='lbl'>Tidpunkt</div>"
      +"<button id='edit-aktivtid-"+log.id+"' style='width:100%;padding:9px;border-radius:10px;background:#131313;border:1px solid #2a2a2a;color:#f2f2f2;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:6px'>⏱ Aktiv Tid</button>"
      +"<input class='inp w100' id='edit-tidpunkt-"+log.id+"' placeholder='HH:MM' maxlength='5' value='"+esc(existTidpunkt)+"' style='text-align:center;font-size:16px;font-weight:600;letter-spacing:2px'/>"
      +"</div>"
      +"<div>"

function switchHistBetygSubview(sub){
  histBetygSubview=sub;
  var tabMap={media:"media",objekt:"objekt",plats:"plats"};
  var tab=tabMap[sub]||"media";
  document.querySelectorAll("[data-histbetygsub]").forEach(function(btn){btn.classList.toggle("on",btn.dataset.histbetygsub===sub);});
  var bc=document.getElementById("hist-betyg-content");
  if(bc)bc.innerHTML="<div style='padding:30px;text-align:center;color:#5c5c5c;font-size:13px'>⏳ Laddar...</div>";
  loadTab(tab).then(function(){renderHistBetygContent();});
}

function renderHistBetygContent(){
  if(histBetygSubview==="objekt")renderHistObj();
  else if(histBetygSubview==="plats")renderHistPlats();
  else renderHistMedia();
}

function showHistMediaModal(title,idx,cat,creator,genre,anteckning){
  var b=document.getElementById("body");
  var existing=b.querySelector("#hist-media-modal");
  if(existing)existing.remove();
  var overlay=document.createElement("div");
  overlay.id="hist-media-modal";
  overlay.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px";
  var selectedRating=0;
  overlay.innerHTML="<div style='background:#161616;border-radius:16px;border:1px solid #4fa8ff;padding:20px;width:100%;max-width:400px'>"
    +"<div class='lbl'>Klarmarkera</div>"
    +"<div style='font-size:15px;color:#f2f2f2;margin:8px 0 4px;font-weight:500'>"+esc(title)+"</div>"
    +(creator?"<div style='font-size:12px;color:#5c5c5c'>"+esc(creator)+"</div>":"")
    +(genre?"<div style='font-size:12px;color:#5c5c5c'>"+esc(genre)+"</div>":"")
    +(anteckning?"<div style='font-size:12px;color:#5c5c5c;margin-bottom:12px'>"+esc(anteckning)+"</div>":"<div style='margin-bottom:12px'></div>")
    +"<div class='lbl'>Betyg</div>"
    +"<div id='hm-stars' style='display:flex;gap:8px;margin-bottom:14px'>"
    +[1,2,3,4,5].map(function(n){return "<button data-star='"+n+"' style='font-size:28px;background:none;border:none;cursor:pointer;opacity:0.3'>★</button>";}).join("")
    +"</div>"
    +"<div class='lbl'>Kommentar (valfritt)</div>"
    +"<textarea class='ta' id='hm-comment' placeholder='Vad tyckte du?' style='min-height:70px;margin-bottom:12px'></textarea>"
    +"<div style='display:flex;gap:8px'>"
    +"<button class='sec' id='hm-save' style='flex:1'>Spara</button>"
    +"<button class='sec ghost' id='hm-cancel' style='flex:1'>Avbryt</button>"
    +"</div></div>";
  document.body.appendChild(overlay);
  overlay.querySelectorAll("[data-star]").forEach(function(star){
    star.onclick=function(){
      selectedRating=parseInt(star.dataset.star);
      overlay.querySelectorAll("[data-star]").forEach(function(s){s.style.opacity=parseInt(s.dataset.star)<=selectedRating?"1":"0.3";});
    };
  });
  overlay.querySelector("#hm-cancel").onclick=function(){overlay.remove();};
  overlay.querySelector("#hm-save").onclick=function(){
    var comment=overlay.querySelector("#hm-comment").value.trim();
    mediaFardig.push({title:title,cat:cat,creator:creator||"",genre:genre||"",anteckning:anteckning||"",rating:selectedRating,comment:comment,timestamp:new Date().toISOString()});
    if(mediaList[cat])mediaList[cat].splice(idx,1);
    saveAndSync("media");
    overlay.remove();
    renderHistory();
  };
}

function renderHistMedia(){
  var c=document.getElementById("hist-betyg-content");
  var allCats=MEDIA_CAT_PRESETS.slice();
  Object.keys(mediaList||{}).forEach(function(k){if(allCats.indexOf(k)<0)allCats.push(k);});
  (mediaFardig||[]).forEach(function(e){if(allCats.indexOf(e.cat)<0)allCats.push(e.cat);});

  // Group pending by category
  var html="<button class='sec ghost' id='hist-media-recension-btn' style='width:100%;margin-bottom:16px'>📝 Recension</button>";

  // Pending media
  var hasPending=allCats.some(function(k){return (mediaList[k]||[]).length;});
  if(hasPending){
    html+="<div class='lbl' style='margin-bottom:12px'>Att konsumera</div>";
    allCats.forEach(function(k){
      var items=mediaList[k]||[];
      if(!items.length)return;
      html+="<div style='margin-bottom:16px'>"
        +"<div style='font-size:12px;font-weight:600;color:#5c5c5c;margin-bottom:8px'>"+esc(k)+"</div>"
        +"<div style='background:#131313;border:1px solid #2a2a2a;border-radius:10px;padding:8px 12px'>"
        +items.map(function(item,i){
          var title=mediaItemTitle(item),creator=mediaItemCreator(item),genre=mediaItemGenre(item),anteckning=mediaItemAnteckning(item);
          return "<div style='padding:8px 0;border-bottom:1px solid #131313;display:flex;align-items:center;gap:8px'>"
            +"<div style='flex:1;min-width:0'>"
            +"<div style='font-size:13px;color:#f2f2f2'>"+esc(title)+"</div>"
            +(creator?"<div style='font-size:11px;color:#5c5c5c'>"+esc(creator)+"</div>":"")
            +(genre?"<div style='font-size:11px;color:#5c5c5c'>"+esc(genre)+"</div>":"")
            +(anteckning?"<div style='font-size:11px;color:#5c5c5c'>"+esc(anteckning)+"</div>":"")
            +"</div>"
            +"<button data-edithistmed='"+i+"' data-edithistmedcat='"+esc(k)+"' style='background:none;border:none;color:#5c5c5c;cursor:pointer;font-size:13px;padding:0 4px;flex-shrink:0'>✏️</button>"
            +"<button data-klarhistmed='"+i+"' data-klarhistcat='"+esc(k)+"' style='padding:4px 10px;border-radius:6px;background:#1c3c5a;border:1px solid #4fa8ff;color:#4fa8ff;font-size:11px;cursor:pointer;white-space:nowrap'>✓ Klar</button>"
            +"<button data-delhistmed='"+i+"' data-delhistmedcat='"+esc(k)+"' style='background:none;border:none;color:#5c5c5c;cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0'>x</button>"
            +"</div>";
        }).join("")
        +"</div></div>";
    });
  }

  // Senaste betyg (de 3 senaste, oavsett kategori)
  if(mediaFardig&&mediaFardig.length){
    var recentFardigMed=mediaFardig.map(function(e,i){return {e:e,idx:i};})
      .sort(function(a,b){return new Date(b.e.timestamp)-new Date(a.e.timestamp);})
      .slice(0,3);
    html+="<div class='lbl' style='margin-top:20px;margin-bottom:12px'>Senaste betyg</div>"
      +recentFardigMed.map(function(entry){
        var e=entry.e,idx=entry.idx;
        var stars=[1,2,3,4,5].map(function(n){return n<=e.rating?"★":"☆";}).join("");
        return "<div style='padding:10px 14px;background:#131313;border:1px solid #2a2a2a;border-radius:10px;margin-bottom:8px'>"
          +"<div style='font-size:11px;color:#4fa8ff;margin-bottom:2px'>"+esc(e.cat)+"</div>"
          +"<div style='display:flex;align-items:center;gap:8px'>"
          +"<div style='flex:1;font-size:13px;color:#f2f2f2;font-weight:500'>"+esc(e.title)+"</div>"
          +"<span style='color:#c9a24a;font-size:14px;letter-spacing:1px'>"+stars+"</span>"
          +"<button data-edithistfardig='"+idx+"' style='background:none;border:none;color:#5c5c5c;cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0'>✏️</button>"
          +"<button data-delhistfardig='"+idx+"' style='background:none;border:none;color:#5c5c5c;cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0'>x</button>"
          +"</div>"
          +(e.creator?"<div style='font-size:11px;color:#5c5c5c;margin-top:2px'>"+esc(e.creator)+"</div>":"")
          +(e.genre?"<div style='font-size:11px;color:#5c5c5c;margin-top:2px'>"+esc(e.genre)+"</div>":"")
          +(e.anteckning?"<div style='font-size:11px;color:#5c5c5c;margin-top:2px'>"+esc(e.anteckning)+"</div>":"")
          +(e.comment?"<div style='font-size:12px;color:#5c5c5c;margin-top:4px;line-height:1.5'>"+esc(e.comment)+"</div>":"")
          +"<div style='font-size:10px;color:#5c5c5c;margin-top:4px'>"+fd(e.timestamp)+"</div>"
          +"</div>";
      }).join("");
  }

  if(!hasPending&&(!mediaFardig||!mediaFardig.length)){
    html+="<div class='empty'><div class='eico'>🎬</div>Ingen media sparad ännu.</div>";
  }

  c.innerHTML=html;
  var histRecBtn=c.querySelector("#hist-media-recension-btn");
  if(histRecBtn)histRecBtn.onclick=function(){
    setView("utvarderingar");utvSubview="media";mediaRecensionCreator=null;
    loadTab("media").then(function(){
      renderUtvarderingarTop();
      renderMediaRecension();
    });
  };
  c.querySelectorAll("[data-edithistmed]").forEach(function(btn){
    btn.onclick=function(){
      editPendingMediaItem(btn.dataset.edithistmedcat,parseInt(btn.dataset.edithistmed),renderHistMedia);
    };
  });
  c.querySelectorAll("[data-klarhistmed]").forEach(function(btn){
    btn.onclick=function(){
      var idx=parseInt(btn.dataset.klarhistmed);
      var cat=btn.dataset.klarhistcat;
      var item=(mediaList[cat]||[])[idx];
      if(item)showHistMediaModal(mediaItemTitle(item),idx,cat,mediaItemCreator(item),mediaItemGenre(item),mediaItemAnteckning(item));
    };
  });
  c.querySelectorAll("[data-delhistmed]").forEach(function(btn){
    btn.onclick=function(){
      var idx=parseInt(btn.dataset.delhistmed);
      var cat=btn.dataset.delhistmedcat;
      var item=(mediaList[cat]||[])[idx];
      var title=item?mediaItemTitle(item):"";
      confirmDelete("Vill du ta bort \""+esc(title)+"\"?",function(){
        if(mediaList[cat])mediaList[cat].splice(idx,1);
        saveAndSync("media");renderHistMedia();
      });
    };
  });
  c.querySelectorAll("[data-edithistfardig]").forEach(function(btn){
    btn.onclick=function(){
      var e=mediaFardig[parseInt(btn.dataset.edithistfardig)];
      if(e)editMediaFardigEntry(e,renderHistMedia);
    };
  });
  c.querySelectorAll("[data-delhistfardig]").forEach(function(btn){
    btn.onclick=function(){
      var idx=parseInt(btn.dataset.delhistfardig);
      var e=mediaFardig[idx];
      if(!e)return;
      confirmDelete("Vill du ta bort betyget för \""+esc(e.title)+"\"?",function(){
        mediaFardig.splice(idx,1);
        saveAndSync("media");
        renderHistMedia();
      });
    };
  });
}

function renderHistBilder(){
  var c=document.getElementById("hist-content");
  if(!imageHist.length){c.innerHTML="<div class='empty'><div class='eico'>🖼️</div>Inga bilder uppladdade annu.</div>";return;}
  renderGroupedByDate(c,imageHist,function(img){return new Date(img.timestamp);},function(img){return imgEntry(img);});

  // Lazy-load images that don't have base64
  imageHist.forEach(function(img){
    if(img.base64||!img.driveId)return;
    loadImageBase64(img).then(function(b64){
      if(!b64)return;
      img.base64=b64;
      var wrap=c.querySelector("#imgwrap-"+img.id);
      if(wrap)wrap.innerHTML="<img src='data:"+(img.mtype||"image/jpeg")+";base64,"+b64+"' style='width:100%;max-height:240px;object-fit:cover;display:block'/>";
    });
  });

  c.querySelectorAll("[data-savetitle]").forEach(function(btn){
    btn.onclick=function(){
      var id=Number(btn.dataset.savetitle);
      var inp=c.querySelector("#img-title-"+id);
      var img=imageHist.find(function(i){return i.id===id;});
      if(img&&inp){img.activity=inp.value.trim()||img.activity;saveAndSync("bilder");renderHistBilder();}
    };
  });
  c.querySelectorAll("[data-dlimg]").forEach(function(btn){
    btn.onclick=function(){
      var id=Number(btn.dataset.dlimg);
      var img=imageHist.find(function(i){return i.id===id;});
      if(!img)return;
      var doDownload=function(b64){
        var a=document.createElement("a");
        a.href="data:"+(img.mtype||"image/jpeg")+";base64,"+b64;
        a.download=btn.dataset.fname;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      };
      if(img.base64){doDownload(img.base64);}
      else{loadImageBase64(img).then(function(b64){if(b64){img.base64=b64;doDownload(b64);}});}
    };
  });
  c.querySelectorAll("[data-delimg]").forEach(function(btn){
    btn.onclick=function(){
      var id=Number(btn.dataset.delimg);
      var img=imageHist.find(function(i){return i.id===id;});
      if(img&&img.driveId)driveDeleteFile(img.driveId);
      confirmDelete('Vill du ta bort bilden?',function(){if(img&&img.driveId)driveDeleteFile(img.driveId);imageHist=imageHist.filter(function(i){return i.id!==id;});saveAndSync("bilder");renderHistBilder();});
    };
  });
}

function bindLogEntryActions(container,onChange){
  container.querySelectorAll(".delbtn[data-id]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();confirmDelete('Vill du ta bort aktiviteten?',function(){logs=logs.filter(function(l){return l.id!==Number(btn.dataset.id);});editingId=null;saveAndSync("aktiviteter");hdr();onChange();});};
  });
  container.querySelectorAll("[data-jumpimg]").forEach(function(el){
    el.onclick=function(e){e.stopPropagation();jumpToImgInHistory(Number(el.dataset.jumpimg));};
  });
  container.querySelectorAll("[data-jumpact]").forEach(function(el){
    el.onclick=function(e){e.stopPropagation();jumpToLogInHistory(Number(el.dataset.jumpact));};
  });
  container.querySelectorAll("[data-edit]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();editingId=Number(btn.dataset.edit);onChange();};
  });
  logs.forEach(function(log){
    if(editingId!==log.id)return;
    // Aktiv tid button
    var aktivBtn=container.querySelector("#edit-aktivtid-"+log.id);
    var editTpInp=container.querySelector("#edit-tidpunkt-"+log.id);
    bindTidpunktInp(editTpInp);
    if(aktivBtn)aktivBtn.onclick=function(){
      var now=new Date();
      var hh=String(now.getHours()).padStart(2,"0");
      var mm=String(now.getMinutes()).padStart(2,"0");
      if(editTpInp)editTpInp.value=hh+":"+mm;
    };
    // Place preset
    var placePresetEl=container.querySelector("#edit-place-preset-"+log.id);
    var placeInpEl=container.querySelector("#edit-place-"+log.id);
    if(placePresetEl&&placeInpEl)placePresetEl.onchange=function(){
      if(!placePresetEl.value)return;
      placeInpEl.value=placeInpEl.value.trim()?(placeInpEl.value.trim()+", "+placePresetEl.value):placePresetEl.value;
      placePresetEl.value="";
    };
    // Clock button
    var editClockH=0,editClockM=0;
    var existDispEl=container.querySelector("#edit-clock-disp-"+log.id);
    if(existDispEl&&existDispEl.textContent){
      var ehm=existDispEl.textContent.match(/(\d+)h/);var emm=existDispEl.textContent.match(/(\d+)m/);
      if(ehm)editClockH=parseInt(ehm[1]);if(emm)editClockM=parseInt(emm[1]);
    }
    var clockBtnEl=container.querySelector("#edit-clock-btn-"+log.id);
    if(clockBtnEl)clockBtnEl.onclick=function(){
      showClockOverlayFor(editClockH,editClockM,function(h,m){
        editClockH=h;editClockM=m;
        clockBtnEl.textContent="⏰ "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
        var disp=container.querySelector("#edit-clock-disp-"+log.id);
        if(disp)disp.textContent=h+"h "+m+"m";
      });
    };
    var saveBtn=container.querySelector("#save-edit-"+log.id);
    if(saveBtn){
      saveBtn.onclick=function(){
        var nameEl=container.querySelector("#edit-name-"+log.id);
        if(nameEl&&nameEl.value.trim())log.activity=nameEl.value.trim();
        var catEl=container.querySelector("#edit-cat-"+log.id);
        if(catEl)log.category=catEl.value;
        var tp=container.querySelector("#edit-tidpunkt-"+log.id);
        var tpResult=buildLogTimestamp(tp?tp.value:"");
        if(!tpResult.ok){
          showInfoPopup("Ogiltig tidpunkt",tpResult.message);
          return;
        }
        var hh=String(tpResult.date.getHours()).padStart(2,"0");
        var mm=String(tpResult.date.getMinutes()).padStart(2,"0");
        if(tp)tp.value=hh+":"+mm;
        var durVal=(editClockH>0||editClockM>0)?editClockH+"h "+editClockM+"m":"";
        var parts=[hh+":"+mm];if(durVal)parts.push(durVal);
        log.time=parts.join(" | ");
        var placeEl=container.querySelector("#edit-place-"+log.id);
        log.place=placeEl?placeEl.value.trim():"";
        var noteEl=container.querySelector("#edit-note-"+log.id);
        log.note=noteEl?noteEl.value.trim():"";
        var dateEl=container.querySelector("#edit-date-"+log.id);
        var newTimestamp=new Date(log.timestamp);
        if(dateEl&&dateEl.value){
          var dParts=dateEl.value.split("-");
          newTimestamp=new Date(parseInt(dParts[0],10),parseInt(dParts[1],10)-1,parseInt(dParts[2],10));
        }
        newTimestamp.setHours(parseInt(hh,10),parseInt(mm,10),0,0);
        log.timestamp=newTimestamp.toISOString();
        editingId=null;saveAndSync("aktiviteter");onChange();
      };
    }
    if(container.querySelector("#cancel-edit-"+log.id)){
      container.querySelector("#cancel-edit-"+log.id).onclick=function(){editingId=null;onChange();};
    }
  });
}

function renderGroupedByDate(container,items,getDate,renderItem){
  var byYear={};
  var MONTHS=["Januari","Februari","Mars","April","Maj","Juni","Juli","Augusti","September","Oktober","November","December"];
  var DAYS=["Sondag","Mandag","Tisdag","Onsdag","Torsdag","Fredag","Lordag"];

  items.forEach(function(item){
    var d=getDate(item);
    var y=d.getFullYear();
    var mo=d.getMonth();
    var day=d.getDate();
    var dayKey=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    var moKey=y+"-"+String(mo+1).padStart(2,"0");
    if(!byYear[y])byYear[y]={};
    if(!byYear[y][moKey])byYear[y][moKey]={month:mo,days:{}};
    if(!byYear[y][moKey].days[dayKey])byYear[y][moKey].days[dayKey]={day:day,weekday:DAYS[d.getDay()],week:isoWeek(d),items:[]};
    byYear[y][moKey].days[dayKey].items.push(item);
  });

  var html="";
  var years=Object.keys(byYear).sort(function(a,b){return b-a;});

  years.forEach(function(y){
    var yearCount=0;
    Object.keys(byYear[y]).forEach(function(mk){Object.keys(byYear[y][mk].days).forEach(function(dk){yearCount+=byYear[y][mk].days[dk].items.length;});});
    html+=folderRow(y,"y-"+y,0,"y-"+openYear,yearCount);

    if(openYear==y){
      var months=Object.keys(byYear[y]).sort(function(a,b){return b.localeCompare(a);});
      months.forEach(function(mk){
        var moData=byYear[y][mk];
        var moCount=0;Object.keys(moData.days).forEach(function(dk){moCount+=moData.days[dk].items.length;});
        var moLabel=MONTHS[moData.month];
        html+=folderRow(moLabel,"m-"+mk,1,"m-"+openMonth,moCount);

        if(openMonth==mk){
          var days=Object.keys(moData.days).sort(function(a,b){return b.localeCompare(a);});
          days.forEach(function(dk){
            var dayData=moData.days[dk];
            var dayLabel=dayData.weekday+" "+dayData.day+" <span style='color:#5c5c5c;font-weight:400'>(v."+dayData.week+")</span>";
            html+=folderRow(dayLabel,"d-"+dk,2,"d-"+openDay,dayData.items.length);

            if(openDay==dk){
              var weekActive=(weekViewDay===dk);
              html+="<div style='display:flex;gap:6px;padding:6px 0 10px 24px'>"
                +"<button data-daymode='"+dk+"' style='background:"+(weekActive?"#131313":"#1c3c5a")+";border:1px solid "+(weekActive?"#2a2a2a":"#4fa8ff")+";color:"+(weekActive?"#5c5c5c":"#4fa8ff")+";font-size:11px;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600'>📆 Dagen</button>"
                +"<button data-weekmode='"+dk+"' style='background:"+(weekActive?"#1c3c5a":"#131313")+";border:1px solid "+(weekActive?"#4fa8ff":"#2a2a2a")+";color:"+(weekActive?"#4fa8ff":"#5c5c5c")+";font-size:11px;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600'>📅 Hela veckan (v."+dayData.week+")</button>"
                +"</div>";
              if(weekActive){
                var wr=getWeekRange(new Date(dk+"T00:00:00"));
                var weekItems=items.filter(function(it){var d2=getDate(it);return d2>=wr.start&&d2<=wr.end;})
                  .sort(function(a,b){return getDate(a)-getDate(b);});
                var lastDayKey=null;
                weekItems.forEach(function(it){
                  var d2=getDate(it);
                  var dk2=d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0")+"-"+String(d2.getDate()).padStart(2,"0");
                  if(dk2!==lastDayKey){
                    lastDayKey=dk2;
                    html+="<div style='padding:8px 0 4px 24px;font-size:11px;font-weight:600;color:#5c5c5c'>"+DAYS[d2.getDay()]+" "+d2.getDate()+" "+MONTHS[d2.getMonth()]+"</div>";
                  }
                  html+=renderItem(it);
                });
              } else {
                dayData.items.forEach(function(item){html+=renderItem(item);});
              }
            }
          });
        }
      });
    }
  });

  container.innerHTML=html;

  container.querySelectorAll("[data-folder]").forEach(function(el){
    el.onclick=function(){
      var key=el.dataset.folder;
      var level=Number(el.dataset.level);
      if(level===0){var y=key.replace("y-","");openYear=(openYear==y?null:y);openMonth=null;openDay=null;weekViewDay=null;}
      else if(level===1){var mk=key.replace("m-","");openMonth=(openMonth==mk?null:mk);openDay=null;weekViewDay=null;}
      else if(level===2){var dk=key.replace("d-","");openDay=(openDay==dk?null:dk);weekViewDay=null;}
      editingId=null;editingFundId=null;renderHistory();
    };
  });
  container.querySelectorAll("[data-daymode]").forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      weekViewDay=null;
      renderHistory();
    };
  });
  container.querySelectorAll("[data-weekmode]").forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      weekViewDay=btn.dataset.weekmode;
      renderHistory();
    };
  });

  // Activity entry actions
  bindLogEntryActions(container,function(){renderHistory();});

  // Funderingar entry actions
  container.querySelectorAll("[data-hdel-fund]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();confirmDelete('Vill du ta bort funderingen?',function(){fundHist=fundHist.filter(function(f){return f.id!==Number(btn.dataset.hdelFund);});editingFundId=null;saveAndSync("funderingar");renderHistory();});};
  });
  container.querySelectorAll("[data-hedit-fund]").forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();editingFundId=Number(btn.dataset.heditFund);render();};
  });
  fundHist.forEach(function(f){
    var saveBtn=container.querySelector("#hsave-fund-"+f.id);
    var cancelBtn=container.querySelector("#hcancel-fund-"+f.id);
    if(saveBtn){
      saveBtn.onclick=function(){
        var newText=container.querySelector("#hedit-fund-"+f.id).value.trim();
        if(newText)f.text=newText;
        var catSel=container.querySelector("#hedit-fundcat-"+f.id);
        if(catSel)f.category=catSel.value||undefined;
        editingFundId=null;saveAndSync("funderingar");renderHistory();
      };
    }
    if(cancelBtn){cancelBtn.onclick=function(){editingFundId=null;render();};}
  });

  // Samtal entry: click to open Samtal-fliken (den gamla person/chatt-vyn finns inte kvar)
  container.querySelectorAll("[data-hconv]").forEach(function(el){
    el.onclick=function(e){
      e.stopPropagation();
      setView("samtal");render();
    };
  });
}

// ---- ÖVERSÄTTNING ----
// Snabb, smidig ordbok/frasöversättning. Inget sparas till Drive/localStorage —
// helt session-tillstånd som nollställs vid nästa översättning eller när fliken lämnas.
function otHandleEnter(e){
  if(e.key!=="Enter")return;
  if(view!=="ai"||aiSubview!=="oversattning")return;
  var tag=(e.target&&e.target.tagName)||"";
  var isEditable=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(e.target&&e.target.isContentEditable);
  if(isEditable)return;
  e.preventDefault();
  otInput="";otContext="";otResult="";
  renderOversattning();
}
function renderOversattning(){
  var b=document.getElementById("ai-content");
  if(!b)return;
  document.removeEventListener("keydown",otHandleEnter);
  if(otLoading){b.innerHTML=spin();return;}
  if(otResult){
    b.innerHTML="<div class='lbl'>Original</div>"
      +"<div class='tbox'>"+esc(otInput)+"</div>"
      +(otContext.trim()?"<div class='lbl' style='margin-top:10px'>Kontext</div><div class='tbox' style='font-size:12px;color:#8c8c8c'>"+esc(otContext)+"</div>":"")
      +"<div class='lbl' style='margin-top:14px'>Översättning</div>"
      +"<div class='tbox'>"+esc(otResult)+"</div>"
      +"<div style='display:flex;gap:8px;margin-top:10px'>"
      +"<button class='sec ghost' id='ot-to-sok-btn' style='flex:1'>🔍 Sök</button>"
      +"<button class='sec ghost' id='ot-to-ordrad-btn' style='flex:1'>📖 Ordråd</button>"
      +"</div>"
      +"<div style='display:flex;gap:8px;margin-top:8px'>"
      +"<button class='sec ghost' id='ot-pin-vokabular-btn' style='flex:1'>📌 Vokabulär</button>"
      +"<button class='sec ghost' id='ot-pin-kunskap-btn' style='flex:1'>📌 Kunskap</button>"
      +"</div>"
      +"<div class='lbl' style='margin-top:16px'>Sök nytt ord/fras (samma kontext)</div>"
      +"<div class='row'><input class='inp' id='ot-next-inp' placeholder='Skriv nästa ord eller fras...' value='"+esc(otNextInput)+"'/><button class='abtn' id='ot-next-btn'>&#8594;</button></div>"
      +"<button class='sec ghost' id='ot-newsearch-btn' style='width:100%;margin-top:10px'>Ny sökning</button>"
      +"<div style='text-align:center;color:#5c5c5c;font-size:12px;margin-top:10px'>Eller tryck Enter för en helt ny sökning</div>";
    document.addEventListener("keydown",otHandleEnter);
    var toSokBtn=b.querySelector("#ot-to-sok-btn");
    if(toSokBtn)toSokBtn.onclick=function(){
      var di=document.getElementById("dictInput");
      if(di){di.value=otResult;di.focus();}
    };
    var toOrdradBtn=b.querySelector("#ot-to-ordrad-btn");
    if(toOrdradBtn)toOrdradBtn.onclick=function(){
      var si=document.getElementById("synInput");
      if(si){si.value=otResult;si.focus();}
    };
    var otPinVokabularBtn=b.querySelector("#ot-pin-vokabular-btn");
    if(otPinVokabularBtn)otPinVokabularBtn.onclick=function(){
      var entryText=otInput+" → "+otResult;
      vokabularHist.push({id:Date.now(),text:entryText,timestamp:new Date().toISOString()});
      saveAndSync("vokabular");
      var orig=otPinVokabularBtn.textContent;
      otPinVokabularBtn.textContent="✓ Sparat";
      setTimeout(function(){otPinVokabularBtn.textContent=orig;},1200);
    };
    var otPinKunskapBtn=b.querySelector("#ot-pin-kunskap-btn");
    if(otPinKunskapBtn)otPinKunskapBtn.onclick=function(){
      var chat=[{role:"user",content:otInput+(otContext.trim()?" ("+otContext.trim()+")":"")},{role:"assistant",content:otResult}];
      pinChatToKunskap(chat);
      var orig=otPinKunskapBtn.textContent;
      otPinKunskapBtn.textContent="✓ Sparat";
      setTimeout(function(){otPinKunskapBtn.textContent=orig;},1200);
    };
    var nextInp=b.querySelector("#ot-next-inp");
    var submitNext=function(){
      var v=(nextInp?nextInp.value:"").trim();
      if(!v)return;
      otInput=v;otNextInput="";otResult="";
      doTranslate();
    };
    if(nextInp){
      nextInp.oninput=function(){otNextInput=nextInp.value;};
      nextInp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();e.stopPropagation();submitNext();}};
      setTimeout(function(){nextInp.focus();},50);
    }
    b.querySelector("#ot-next-btn").onclick=submitNext;
    b.querySelector("#ot-newsearch-btn").onclick=function(){
      otInput="";otContext="";otResult="";otNextInput="";
      renderOversattning();
    };
    return;
  }
  b.innerHTML="<div class='eico' style='text-align:center;padding-top:10px'>🌐</div>"
    +modelSelectHtml("ot")
    +"<div class='lbl'>Ord eller fras</div>"
    +"<textarea class='ta' id='ot-inp' placeholder='Skriv det du vill översätta...' style='min-height:80px'>"+esc(otInput)+"</textarea>"
    +"<div class='lbl' style='margin-top:10px'>Kontext (valfritt)</div>"
    +"<input class='inp w100' id='ot-ctx' placeholder='T.ex. till engelska, formellt, brittisk stavning...' value='"+esc(otContext)+"'/>"
    +"<button class='sec' id='ot-send' style='width:100%;margin-top:12px'>Översätt</button>";
  bindModelSelect(b,"ot");
  var inp=b.querySelector("#ot-inp");
  var ctxEl=b.querySelector("#ot-ctx");
  if(inp){
    inp.oninput=function(){otInput=inp.value;};
    inp.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doTranslate();}};
    setTimeout(function(){inp.focus();},50);
  }
  if(ctxEl){
    ctxEl.oninput=function(){otContext=ctxEl.value;};
    ctxEl.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();doTranslate();}};
  }
  b.querySelector("#ot-send").onclick=function(){doTranslate();};
}
async function doTranslate(){
  var text=(otInput||"").trim();
  if(!text)return;
  otLoading=true;renderOversattning();
  var sys="Du ar en oversattare. Oversatt ordet eller frasen som anvandaren ger. Ta hansyn till eventuell kontext (t.ex. malsprak, ton eller sammanhang) om sadan anges. Svara ENDAST med sjalva oversattningen, utan forklaringar, citattecken eller extra text.";
  var userMsg="Text: \""+text+"\""+(otContext.trim()?"\nKontext: "+otContext.trim():"");
  try{
    var res=await aiCall(sys,userMsg,300);
    var data=await res.json();
    otResult=(aiText(data)||"").trim()||"Kunde inte översätta. Försök igen.";
  }catch(e){
    otResult="Något gick fel. Försök igen.";
  }
  otLoading=false;renderOversattning();
}

function renderTerapi(){
  var b=document.getElementById("ai-content");
  var chatHtml="";
  if(tMessages.length){
    chatHtml="<div class='chat-area'>"
      +tMessages.map(function(m){
        if(m.role==="user"){
          return "<div style='display:flex;justify-content:flex-end'><div class='bubble-me'>"+esc(m.content)+"</div></div>";
        }
        return "<div style='display:flex;justify-content:flex-start'><div class='bubble-them'>"+esc(m.content)+"</div></div>";
      }).join("")
      +(tLoading?"<div style='display:flex;justify-content:flex-start'><div class='bubble-them' style='color:#5c5c5c;font-style:italic'>Skriver...</div></div>":"")
      +"</div>";
  } else {
    chatHtml="<div style='text-align:center;padding:32px 0 20px;color:#5c5c5c;font-size:14px;line-height:1.7'>"
      +"<div style='font-size:36px;margin-bottom:12px'>🧠</div>"
      +"Jag ar har for att lyssna och hjalpa dig reflektera.<br>Dela dina tankar, bekymmer eller ideer.</div>";
  }
  var savedHist="";
  if(tHist.length){
    savedHist="<div class='mt20'><div class='lbl'>Sparade samtal</div>"
      +tHist.slice(0,5).map(function(h,i){return histRow(h,i,"tidx","<span class='kbadge'>"+h.messages.length+" meddelanden</span>");}).join("")
      +"</div>";
  }
  var btns=tMessages.length
    ?"<div style='display:flex;gap:8px;margin-bottom:12px'><button class='sec ghost' id='tsave' style='flex:1'>Spara samtal</button><button class='sec ghost' id='tclear' style='flex:1'>Nytt samtal</button><button class='sec ghost' id='terapi-pin-btn' style='flex:1'>📌 Kunskap</button></div>"
    :"";
  b.innerHTML=chatHtml+btns
    +"<div class='row'><input class='inp' id='tinp' placeholder='Skriv dina tankar...' value='"+esc(tInput)+"'/><button class='abtn' id='tsend'>&#8594;</button></div>"
    +savedHist;
  var ti=b.querySelector("#tinp");
  if(ti){
    ti.oninput=function(){tInput=ti.value;};
    ti.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&ti.value.trim()){e.preventDefault();doSendTerapi(ti.value.trim());}};
    if(!tLoading)setTimeout(function(){ti.focus();},50);
  }
  b.querySelector("#tsend").onclick=function(){var v=b.querySelector("#tinp").value.trim();if(v)doSendTerapi(v);};
  if(tMessages.length){
    b.querySelector("#tsave").onclick=function(){
      var summary=tMessages[0]?tMessages[0].content.slice(0,60)+"...":"Samtal";
      tHist=[{id:Date.now(),summary:summary,messages:tMessages.slice(),timestamp:new Date().toISOString()}].concat(tHist).slice(0,20);
      tMessages=[];tInput="";saveAndSync("terapi");renderTerapi();
    };
    b.querySelector("#tclear").onclick=function(){tMessages=[];tInput="";renderTerapi();};
    var terapiPinBtn=b.querySelector("#terapi-pin-btn");
    if(terapiPinBtn)terapiPinBtn.onclick=function(){
      pinChatToKunskap(tMessages);
      var orig=terapiPinBtn.textContent;
      terapiPinBtn.textContent="✓ Sparat";
      setTimeout(function(){terapiPinBtn.textContent=orig;},1200);
    };
  }
  bindHist(b,"tidx",
    function(i){tMessages=tHist[i].messages.slice();renderTerapi();},
    function(i){tHist.splice(i,1);saveAndSync("terapi");renderTerapi();}
  );
  // Scroll chat to bottom
  var ca=b.querySelector(".chat-area");if(ca)ca.scrollTop=ca.scrollHeight;
}
async function doSendTerapi(text){
  tMessages.push({role:"user",content:text});
  tInput="";tLoading=true;renderTerapi();
  var sys="Du ar en empatisk samtalsstod. Lyssna aktivt, stalla genomtankta foljdfragor och hjalp personen reflektera over sina tankar och ideer. Ge rad nar det frages men fokusera annars pa att hjalpa personen tanka igenom sina egna losningar. Svara pa svenska, var varm. Halla svaren kortfattade (max 3-4 meningar).";
  var history=tMessages.slice(-12).map(function(m){return {role:m.role,content:m.content};});
  try{
    var res=await aiChat(sys,history,600);
    var data=await res.json();
    var reply=data.choices&&data.choices[0]?data.choices[0].message.content||"":"Kunde inte svara. Forsok igen.";
    tMessages.push({role:"assistant",content:reply});
  }catch(e){tMessages.push({role:"assistant",content:"Nagot gick fel. Forsok igen."});}
  tLoading=false;renderTerapi();
}

async function fetchTips(){
  tipsLoading=true;tipText="";tipsChat=null;renderTips();
  var sum=logs.slice(0,20).map(function(l){return "["+l.category+"] "+l.activity+(l.note?": "+l.note:"");}).join("\n")||"Inga aktiviteter loggade.";
  var prompt="Tips om: "+tipTopic+"\n\nAktiviteter for kontext:\n"+sum+"\n\nGe 3-5 konkreta, personliga tips pa svenska.";
  try{
    var res=await aiCall("Du ar en coach som ger personliga, konkreta tips pa svenska anpassade till amnet anvandaren fragar om. Hall det kort och actionbart.",prompt,1000);
    var data=await res.json();tipText=aiText(data)||"Kunde inte hamta tips.";
    if(tipText&&tipText!=="Kunde inte hamta tips."){
      tipsHistory.unshift({topic:tipTopic,text:tipText,timestamp:new Date().toISOString()});
      if(tipsHistory.length>5)tipsHistory.length=5;
      saveAndSync("tips");
      tipsChat=[{role:"user",content:prompt},{role:"assistant",content:tipText}];
    }
  }catch(e){tipText="Nagot gick fel. Forsok igen.";}
  tipsLoading=false;renderTips();
}

async function downloadZip(statusEl){
  try{
    if(!window.JSZip){if(statusEl)statusEl.innerHTML="<div style='color:#d97a83;font-size:13px;margin-top:8px'>JSZip inte laddad.</div>";return;}
    if(statusEl)statusEl.innerHTML="<div style='color:#5c5c5c;font-size:13px;margin-top:8px'>Skapar ZIP...</div>";
    var zip=new JSZip();
    var date=new Date().toISOString().slice(0,10);

    // JSON files per tab
    var jsonFiles=[
      {path:"Aktivitet/data.json",data:{logs:logs}},
      {path:"Samtal/Text/data.json",data:{konversationer:konversationer}},
      {path:"Samtal/Muntligt/data.json",data:{muntKonversationer:muntKonversationer}},
      {path:"Fundering/data.json",data:{fundHist:fundHist}},
      {path:"Fundering/Lardom/Vokabular/data.json",data:{vokabularHist:vokabularHist}},
      {path:"Fundering/Lardom/Kunskap/data.json",data:{kunskapHist:kunskapHist}},
      {path:"Fundering/Lardom/TipsTricks/data.json",data:{tipsTricksHist:tipsTricksHist}},
      {path:"Konversation/Samtalsämne/data.json",data:{amneHist:amneHist}},
      {path:"Betyg/Media/data.json",data:{mediaList:mediaList,mediaFardig:mediaFardig}},
      {path:"Betyg/Föremål/data.json",data:{objList:objList,objFardig:objFardig}},
      {path:"Betyg/Plats/data.json",data:{platsList:platsList,platsFardig:platsFardig}},
      {path:"Installningar/Inmatningar/data.json",data:{aktivitetHistory:aktivitetHistory,platsHistory:platsHistory,anteckningHistory:anteckningHistory,anteckningByCat:ANTECKNING_BY_CAT,actPresetsByCat:ACT_PRESETS_BY_CAT,placePresetsByCat:PLACE_PRESETS_BY_CAT,mediaCreatorByCat:MEDIA_CREATOR_BY_CAT,mediaGenreByCat:MEDIA_GENRE_BY_CAT,objMakerByCat:OBJ_MAKER_BY_CAT,platsKommunByCat:PLATS_KOMMUN_BY_CAT}},
      {path:"AI/Sök/data.json",data:{fHist:fHist}},
      {path:"AI/Text/data.json",data:{kHist:kHist,sHist:sHist,oHist:oHist,synHist:synHist}},
      {path:"AI/Terapi/data.json",data:{tHist:tHist}},
      {path:"AI/Tips/Tips/data.json",data:{tipsHistory:tipsHistory}},
      {path:"Konversation/Skämt/data.json",data:{savedJokes:savedJokes}},
      {path:"Bilder/index.json",data:{images:imageHist.map(function(i){return {id:i.id,logId:i.logId,activity:i.activity,category:i.category,mtype:i.mtype,timestamp:i.timestamp,driveId:i.driveId||null};})}},
      {path:"Installningar/data.json",data:{placePresets:PLACE_PRESETS,actPresets:ACT_PRESETS,catPresets:CAT_PRESETS,fundCatPresets:FUND_CAT_PRESETS,tipsTricksCatPresets:TIPSTRICKS_CAT_PRESETS,mediaCatPresets:MEDIA_CAT_PRESETS,amneCatPresets:AMNE_CAT_PRESETS,objCatPresets:OBJ_CAT_PRESETS,platsCatPresets:PLATS_CAT_PRESETS}}
    ];
    jsonFiles.forEach(function(f){
      zip.file(f.path,JSON.stringify(f.data,null,2));
    });

    // Images — load from Drive if needed
    var imgCount=0,imgFailCount=0;
    for(var i=0;i<imageHist.length;i++){
      var img=imageHist[i];
      var b64=img.base64;
      if(!b64&&img.driveId){
        if(statusEl)statusEl.innerHTML="<div style='color:#5c5c5c;font-size:13px;margin-top:8px'>Hämtar bild "+(i+1)+"/"+imageHist.length+"...</div>";
        try{b64=await loadImageBase64(img);}catch(e){b64=null;}
      }
      if(b64){
        try{
          var fname=buildImageFilename(img);
          var binary=atob(b64);
          var bytes=new Uint8Array(binary.length);
          for(var j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);
          zip.file("Bilder/"+fname,bytes,{binary:true});
          imgCount++;
        }catch(e){imgFailCount++;}
      } else {
        imgFailCount++;
      }
    }

    if(statusEl)statusEl.innerHTML="<div style='color:#5c5c5c;font-size:13px;margin-top:8px'>Packar ZIP...</div>";
    var blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});

// Validerar/bygger loggens faktiska tidpunkt utifrån "Tidpunkt"-inmatningen.
// Tomt fält -> nu. Ogiltigt format -> ok:false med en förklarande text.
function buildLogTimestamp(tidpunktRaw){
  var tp=(tidpunktRaw||"").trim();
  if(!tp)return {ok:true,date:new Date()};
  var m=tp.match(/^(\d{2}):(\d{2})$/);
  if(!m)return {ok:false,message:"Tidpunkten måste skrivas i formatet HH:MM, t.ex. 14:30."};
  var hh=parseInt(m[1],10),mm=parseInt(m[2],10);
  if(hh<0||hh>23||mm<0||mm>59)return {ok:false,message:"Tidpunkten måste vara ett giltigt klockslag mellan 00:00 och 23:59."};
  var d=new Date();
  d.setHours(hh,mm,0,0);
  return {ok:true,date:d};
}

function importMediaCsv(file,cat){
  var st=document.getElementById("mediastatus");
  if(st)st.innerHTML="<div style='color:#5c5c5c;font-size:13px;margin-top:8px'>Importerar...</div>";
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var text=e.target.result.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");

      // Split into pending and fardig sections at ->FÄRDIGA<-
      var fardigSplit=text.split("->FÄRDIGA<-");
      var pendingText=fardigSplit[0];
      var fardigText=fardigSplit.length>1?fardigSplit[1]:"";

      function parseSections(txt){
        // Find all -> "Kategori": blocks — category name is used directly as the key
        var result={};
        var regex=/-> "([^"]+)":\n([\s\S]*?)(?=\n-> "|$)/g;
        var m;
        while((m=regex.exec(txt))!==null){
          var catKey=m[1].trim();
          if(!catKey)continue;
          var raw=m[2].trim();
          var items=[];
          if(raw){
            // Each line: "Title","Creator","Genre" (optional trailing fields may be missing for old exports)
            raw.split(/\n/).forEach(function(line){
              line=line.trim().replace(/,$/,"");
              if(!line)return;
              var titleM=line.match(/^"((?:[^"\\]|\\.)*)"/);
              if(!titleM){
                // Fallback: plain unquoted line (old format)
                items.push({title:line.replace(/^,|,$/g,"").trim(),creator:"",genre:""});
                return;
              }
              var title=titleM[1].replace(/""/g,'"');
              var rest=line.slice(titleM[0].length).replace(/^,/,"");
              var creatorM=rest.match(/^"((?:[^"\\]|\\.)*)"/);
              var creator=creatorM?creatorM[1].replace(/""/g,'"'):"";
              var rest2=creatorM?rest.slice(creatorM[0].length).replace(/^,/,""):"";
              var genreM=rest2.match(/^"((?:[^"\\]|\\.)*)"/);
              var genre=genreM?genreM[1].replace(/""/g,'"'):"";
              items.push({title:title,creator:creator,genre:genre});
            });
          }
          result[catKey]=items;
        }
        return result;
      }

      // Parse pending
      var newMedia={};
      var parsed=parseSections(pendingText);
      Object.keys(parsed).forEach(function(k){newMedia[k]=parsed[k];});
      mediaList=newMedia;

      // Parse FÄRDIGA if present
      if(fardigText){
        var newFardig=[];
        var fregex=/-> "([^"]+)":\n([\s\S]*?)(?=\n-> "|$)/g;
        var fm;
        while((fm=fregex.exec(fardigText))!==null){
          var catKey=fm[1].trim();
          if(!catKey)continue;
          fm[2].trim().split(/,?\n/).forEach(function(line){
            line=line.trim();
            if(!line)return;
            // Format: "Titel","Kreatör","Genre", betyg:N, kommentar:"..."
            var titleM=line.match(/^"((?:[^"\\]|\\.)*)"/);
            if(!titleM)return;
            var title=titleM[1].replace(/""/g,'"');
            var rest=line.slice(titleM[0].length).replace(/^,/,"");
            var creatorM=rest.match(/^"((?:[^"\\]|\\.)*)"/);
            var creator=creatorM?creatorM[1].replace(/""/g,'"'):"";
            var rest2=creatorM?rest.slice(creatorM[0].length).replace(/^,/,""):"";
            var genreM=rest2.match(/^"((?:[^"\\]|\\.)*)"/);
            var genre=genreM?genreM[1].replace(/""/g,'"'):"";
            var ratingM=line.match(/betyg:(\d)/);
            var commentM=line.match(/kommentar:"((?:[^"\\]|\\.)*)"/);
            newFardig.push({
              title:title,cat:catKey,creator:creator,genre:genre,
              rating:ratingM?parseInt(ratingM[1]):0,
              comment:commentM?commentM[1]:"",
              timestamp:new Date().toISOString()
            });
          });
        }
        mediaFardig=newFardig;
      }

      saveAndSync("media");
      var totalPending=Object.values(newMedia).reduce(function(s,a){return s+a.length;},0);
      if(st)st.innerHTML="<div style='color:#7fae7f;font-size:13px;margin-top:8px'>✓ "+totalPending+" att konsumera, "+(fardigText?mediaFardig.length:0)+" färdiga inladdade.</div>";
    }catch(err){
      if(st)st.innerHTML="<div style='color:#d97a83;font-size:13px;margin-top:8px'>Fel: "+esc(err.message)+"</div>";
    }
  };
  reader.readAsText(file,"UTF-8");
}

    var dataUrl="data:"+(img.mtype||"image/jpeg")+";base64,"+img.base64;
    var canvas=document.createElement("canvas");
    var image=new Image();
    image.onload=function(){
      canvas.width=image.width;canvas.height=image.height;
      var ctx=canvas.getContext("2d");
      ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0);

      var a=document.createElement("a");
      a.href=jpegUrl;a.download=fname+".jpg";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    };

      msgs.forEach(function(m){
        var who=m.sender==="mig"?"Jag":"De";
        var cls=m.sender==="mig"?"bubble-me":"bubble-them";
        html+='<div class="sender">'+esc(who)+'</div><div class="'+cls+'">'+esc(m.text)+'</div>';
      });
      html+='</div>';
    });
  }

  // SAMTAL (Muntligt)
  if(monthMuntKonvs.length){
    html+='<h2>Samtal - Muntligt ('+monthMuntKonvs.length+')</h2>';
    monthMuntKonvs.forEach(function(k){
      html+='<div class="entry"><h3>'+esc(k.name)+'</h3>';
      (k.entries||[]).forEach(function(e){
        html+='<div class="sender">'+fd(e.timestamp)+'</div><div class="bubble-them">'+esc(e.summary)+(e.feeling?' <em>('+esc(e.feeling)+')</em>':'')+'</div>';
      });
      html+='</div>';
    });
  }

  if(!monthLogs.length&&!monthFund.length&&!monthConvs.length&&!monthMuntKonvs.length){
    html+='<p style="color:#888;padding:32px 0">Inga inlagg for '+monthName+'.</p>';
  }

  html+='</body></html>';

  // Open in new window and print
  var win=window.open("","_blank");
  win.document.write(html);
  win.document.close();
  win.onload=function(){win.focus();win.print();};
}



// ---- NYHETER ----;

function renderNyheter(){
  var b=document.getElementById("body");
  var html="<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px'>"
    +Object.keys(NYHETER_SITES).map(function(k){
      var site=NYHETER_SITES[k];
      return "<a href='"+esc(site.url)+"' target='_blank' rel='noopener' style='text-decoration:none'>"
        +"<div style='padding:20px 16px;background:#161616;border-radius:14px;border:1px solid #2a2a2a;"
        +"text-align:center;cursor:pointer'>"
        +"<div style='font-size:28px;margin-bottom:10px'>"+site.label.split(" ")[0]+"</div>"
        +"<div style='font-size:14px;font-weight:600;color:#f2f2f2'>"+site.label.split(" ").slice(1).join(" ")+"</div>"
        +"<div style='font-size:11px;color:#5c5c5c;margin-top:6px'>"+esc(site.url.replace(/https?:\/\//,"").replace(/\/$/,""))+"</div>"
        +"</div></a>";
    }).join("")
    +"</div>";
  b.innerHTML=html;
}
